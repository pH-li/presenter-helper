name: CI / CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Required files exist
        run: |
          for f in public/index.html public/app.js public/store.js public/style.css netlify.toml; do
            test -f "$f" || { echo "::error::Missing $f"; exit 1; }
          done

      - name: JavaScript syntax check
        run: |
          for f in public/*.js; do
            echo "Checking $f"
            node --check "$f"
          done

  deploy:
    name: Deploy to Netlify
    needs: check
    runs-on: ubuntu-latest
    # Fork PRs don't get secrets, so skip them.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Skip if Netlify secrets are not configured
        id: secrets
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::notice::NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID not set — skipping deploy. See README."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy preview (pull request)
        if: steps.secrets.outputs.ok == 'true' && github.event_name == 'pull_request'
        id: preview
        run: |
          npx --yes netlify-cli deploy --dir=public --alias="pr-${{ github.event.pull_request.number }}" \
            --message="PR #${{ github.event.pull_request.number }}" --json > deploy.json
          url=$(node -p "require('./deploy.json').deploy_url")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on PR
        if: steps.preview.outputs.url
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} \
            --edit-last --create-if-none --body "Deploy preview: ${{ steps.preview.outputs.url }}"

      - name: Deploy to production (main)
        if: steps.secrets.outputs.ok == 'true' && github.event_name == 'push'
        run: npx --yes netlify-cli deploy --dir=public --prod --message="${{ github.sha }}"
